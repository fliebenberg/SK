<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F8FAFC; --surface:#FFFFFF; --surface-2:#F1F5F9; --surface-3:#E9EEF5;
  --text:#0F172A; --text-dim:#64748B; --text-faint:#94A3B8;
  --border:#E2E8F0; --border-strong:#CBD5E1;
  --accent:#FF3E00; --accent-text:#B82B00; --accent-soft:rgba(255,62,0,.07); --accent-line:rgba(255,62,0,.35);
  --info:#155E75; --ok:#047857; --alert:#BE123C;
  --shadow:0 1px 2px rgba(15,23,42,.05), 0 10px 30px -18px rgba(15,23,42,.35);
  --code-bg:#F1F5F9; --code-text:#334155;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F172A; --surface:#172136; --surface-2:#1E293B; --surface-3:#243146;
    --text:#FFFFFF; --text-dim:#94A3B8; --text-faint:#64748B;
    --border:rgba(255,255,255,.09); --border-strong:rgba(255,255,255,.16);
    --accent:#FF3E00; --accent-text:#FF7A4D; --accent-soft:rgba(255,62,0,.12); --accent-line:rgba(255,62,0,.45);
    --info:#00E5FF; --ok:#00E676; --alert:#FF003C;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 32px -18px rgba(0,0,0,.8);
    --code-bg:#111C31; --code-text:#CBD5E1;
  }
}
:root[data-theme="dark"]{
  --bg:#0F172A; --surface:#172136; --surface-2:#1E293B; --surface-3:#243146;
  --text:#FFFFFF; --text-dim:#94A3B8; --text-faint:#64748B;
  --border:rgba(255,255,255,.09); --border-strong:rgba(255,255,255,.16);
  --accent:#FF3E00; --accent-text:#FF7A4D; --accent-soft:rgba(255,62,0,.12); --accent-line:rgba(255,62,0,.45);
  --info:#00E5FF; --ok:#00E676; --alert:#FF003C;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 32px -18px rgba(0,0,0,.8);
  --code-bg:#111C31; --code-text:#CBD5E1;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth; scroll-padding-top:88px}
@media (prefers-reduced-motion: reduce){ html{scroll-behavior:auto} *{transition:none !important; animation:none !important} }
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:16.5px; line-height:1.68; -webkit-font-smoothing:antialiased;
}
.label{font-family:Orbitron,"Segoe UI",sans-serif; font-weight:700; text-transform:uppercase; letter-spacing:.14em}

/* ---------- top bar ---------- */
.topbar{
  position:sticky; top:0; z-index:40; background:var(--bg); background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
}
.topbar-inner{
  max-width:1280px; margin:0 auto; padding:0 24px; height:60px;
  display:flex; align-items:center; gap:20px;
}
.wordmark{display:flex; align-items:center; gap:10px; min-width:0}
.wordmark .dot{width:9px; height:9px; border-radius:50%; background:var(--accent); flex:none; box-shadow:0 0 0 4px var(--accent-soft)}
.wordmark .name{font-family:Orbitron,sans-serif; font-weight:700; font-size:12.5px; letter-spacing:.16em; text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.wordmark .sub{font-size:11px; color:var(--text-dim); letter-spacing:.04em; white-space:nowrap}
.spacer{flex:1}
.progress{display:flex; align-items:center; gap:9px; font-size:11px; color:var(--text-dim); white-space:nowrap}
.progress .bar{width:74px; height:5px; border-radius:99px; background:var(--surface-3); overflow:hidden}
.progress .bar > i{display:block; height:100%; background:var(--accent); width:0%; transition:width .3s ease}
.progress b{font-family:Orbitron,sans-serif; font-weight:700; color:var(--text); font-variant-numeric:tabular-nums; font-size:11px}

.btn{
  font-family:Inter,sans-serif; font-size:12px; font-weight:600; color:var(--text);
  background:var(--surface); border:1px solid var(--border-strong); border-radius:9px;
  padding:7px 12px; cursor:pointer; display:inline-flex; align-items:center; gap:7px;
  transition:background .15s ease, border-color .15s ease, color .15s ease; white-space:nowrap;
}
.btn:hover{background:var(--surface-2); border-color:var(--accent-line)}
.btn:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.btn-primary{background:var(--accent); border-color:var(--accent); color:#fff}
.btn-primary:hover{background:#E63700; border-color:#E63700; color:#fff}
.btn-ghost{background:transparent; border-color:transparent; color:var(--text-dim); padding:7px 9px}
.btn-ghost:hover{background:var(--surface-2); color:var(--text)}
/* Server-mode save indicator. Hidden entirely on a static page, where there is nothing to report. */
.save-state{
  font-size:11px; letter-spacing:.02em; color:var(--text-dim); padding:0 4px; white-space:nowrap;
  display:inline-flex; align-items:center; gap:5px;
}
.save-state::before{content:""; width:6px; height:6px; border-radius:50%; background:currentColor; flex:none}
.save-state.saving{color:var(--text-dim)}
.save-state.saved{color:var(--ok)}
.save-state.error{color:var(--alert); font-weight:600}
@media (max-width:760px){ .save-state{display:none} }
.btn .count{
  font-family:Orbitron,sans-serif; font-weight:700; font-size:10px; font-variant-numeric:tabular-nums;
  background:var(--accent); color:#fff; border-radius:99px; padding:1px 6px; min-width:18px; text-align:center;
}

/* ---------- shell ---------- */
.shell{max-width:1280px; margin:0 auto; padding:0 24px; display:grid; grid-template-columns:236px minmax(0,1fr); gap:56px; align-items:start}
.toc{position:sticky; top:84px; padding:36px 0 48px; max-height:calc(100vh - 100px); overflow-y:auto}
.toc h4{margin:0 0 12px; font-size:9.5px; color:var(--text-faint)}
.toc a{
  display:flex; align-items:baseline; gap:8px; text-decoration:none; color:var(--text-dim);
  font-size:13px; line-height:1.4; padding:6px 10px; border-radius:7px; border-left:2px solid transparent;
}
.toc a:hover{background:var(--surface-2); color:var(--text)}
.toc a.active{color:var(--text); border-left-color:var(--accent); background:var(--accent-soft)}
.toc a .num{font-family:Orbitron,sans-serif; font-size:9.5px; font-weight:700; color:var(--text-faint); flex:none; font-variant-numeric:tabular-nums}
.toc a.docrow{margin-top:14px; color:var(--text); font-weight:600}
.toc a.docrow .num{color:var(--accent)}
.toc .tocgroup .sub{display:none; font-size:12px; padding:4px 10px 4px 26px; color:var(--text-faint)}
.toc .tocgroup.open .sub{display:flex}
.toc .tocgroup .sub:hover{color:var(--text); background:var(--surface-2)}
.toc .tocgroup .sub .num{font-size:9px}
.toc a .badge{
  margin-left:auto; font-family:Orbitron,sans-serif; font-size:9px; font-weight:700; font-variant-numeric:tabular-nums;
  background:var(--accent); color:#fff; border-radius:99px; padding:1px 5px; flex:none;
}

main{padding:36px 48px 160px 0; min-width:0}
article{max-width:68ch}

/* ---------- document typography ---------- */
h1.doc-title{
  font-family:Orbitron,sans-serif; font-weight:700; font-size:clamp(26px,3.4vw,38px); line-height:1.15;
  letter-spacing:-.005em; margin:0 0 14px; text-wrap:balance;
}
.doc-meta{display:flex; flex-wrap:wrap; gap:8px; margin:0 0 44px; padding-bottom:32px; border-bottom:1px solid var(--border)}
.chip{
  font-size:11px; color:var(--text-dim); background:var(--surface-2);
  border:1px solid var(--border); border-radius:99px; padding:4px 11px;
}
.chip strong{color:var(--text); font-weight:600}

h2{
  font-family:Orbitron,sans-serif; font-weight:700; font-size:19px; line-height:1.3; letter-spacing:.01em;
  margin:64px 0 4px; padding-top:28px; border-top:1px solid var(--border); text-wrap:balance;
}
h2:first-of-type{border-top:none; padding-top:0}
h2.docbreak{
  font-size:24px; margin-top:88px; padding-top:36px; border-top:2px solid var(--accent);
}
h2.docbreak::before{
  content:"Document"; display:block; font-size:9px; letter-spacing:.16em; color:var(--accent-text);
  margin-bottom:10px;
}
h3{font-size:15.5px; font-weight:700; margin:38px 0 2px; letter-spacing:.005em; color:var(--text); text-wrap:balance}
p{margin:16px 0}
ul,ol{margin:16px 0; padding-left:22px}
li{margin:9px 0}
li::marker{color:var(--text-faint)}
strong{font-weight:650; color:var(--text)}
em{font-style:italic}
a.mdlink{color:var(--accent-text); text-decoration:none; border-bottom:1px solid var(--accent-line)}
a.mdlink:hover{border-bottom-color:var(--accent-text)}
code{
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:.855em;
  background:var(--code-bg); color:var(--code-text); border:1px solid var(--border); border-radius:5px; padding:1px 5px;
}
pre{
  background:var(--code-bg); border:1px solid var(--border); border-radius:11px;
  padding:16px 18px; overflow-x:auto; margin:20px 0;
}
pre code{background:none; border:none; padding:0; font-size:12.8px; line-height:1.65; color:var(--code-text)}
hr.rule{display:none}

.tablewrap{overflow-x:auto; margin:20px 0; border:1px solid var(--border); border-radius:11px; background:var(--surface)}
table{border-collapse:collapse; width:100%; font-size:13.5px}
th{
  text-align:left; font-family:Orbitron,sans-serif; font-weight:700; font-size:9.5px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--text-dim); padding:12px 15px; border-bottom:1px solid var(--border); white-space:nowrap;
}
td{padding:12px 15px; border-bottom:1px solid var(--border); vertical-align:top; line-height:1.55}
tr:last-child td{border-bottom:none}
td:first-child{color:var(--text); font-weight:500}

/* ---------- open question blocks ---------- */
.qblock{
  background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--accent);
  border-radius:0 11px 11px 0; padding:18px 20px 18px 22px; margin:24px 0; box-shadow:var(--shadow);
}
.qblock .qhead{display:flex; align-items:center; gap:10px; margin-bottom:8px}
.qblock .qnum{
  font-family:Orbitron,sans-serif; font-weight:700; font-size:9.5px; letter-spacing:.1em;
  color:#fff; background:var(--accent); border-radius:5px; padding:3px 7px; flex:none;
}
.qblock .qtag{font-family:Orbitron,sans-serif; font-weight:700; font-size:9px; letter-spacing:.13em; text-transform:uppercase; color:var(--text-faint)}
.qblock p{margin:8px 0 0; font-size:14.5px; line-height:1.62; color:var(--text-dim)}
.qblock p:first-of-type{margin-top:0}
.qblock p strong{color:var(--text)}
.dblock{
  background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--ok);
  border-radius:0 11px 11px 0; padding:18px 20px 18px 22px; margin:24px 0;
}
.dblock .qhead{display:flex; align-items:center; gap:10px; margin-bottom:8px}
.dblock .qnum{
  font-family:Orbitron,sans-serif; font-weight:700; font-size:9.5px; letter-spacing:.1em;
  color:var(--ok); border:1px solid var(--ok); border-radius:5px; padding:2px 7px; flex:none;
}
.dblock .qtag{font-family:Orbitron,sans-serif; font-weight:700; font-size:9px; letter-spacing:.13em; text-transform:uppercase; color:var(--text-faint)}
.dblock p{margin:8px 0 0; font-size:14.5px; line-height:1.62; color:var(--text-dim)}
.dblock p:first-of-type{margin-top:0}
.dblock p strong{color:var(--text)}
blockquote.note{
  border-left:3px solid var(--border-strong); padding:2px 0 2px 18px; margin:22px 0; color:var(--text-dim); font-size:14.5px;
}

/* ---------- comment machinery ---------- */
.block{position:relative}
.block > .addbtn{
  position:absolute; right:-44px; top:3px; width:30px; height:30px; border-radius:8px;
  border:1px solid var(--border); background:var(--surface); color:var(--text-faint);
  display:grid; place-items:center; cursor:pointer; opacity:0; transition:opacity .14s ease, color .14s ease, border-color .14s ease;
}
.block:hover > .addbtn, .block:focus-within > .addbtn, .block.has-comments > .addbtn{opacity:1}
.block > .addbtn:hover{color:var(--accent-text); border-color:var(--accent-line)}
.block > .addbtn:focus-visible{opacity:1; outline:2px solid var(--accent); outline-offset:2px}
.block.has-comments{background:var(--accent-soft); border-radius:8px; box-shadow:0 0 0 8px var(--accent-soft)}
.block.flash{animation:flash 1.4s ease}
@keyframes flash{0%,100%{box-shadow:0 0 0 8px var(--accent-soft)} 30%{box-shadow:0 0 0 8px rgba(255,62,0,.28)}}

.editor{margin:12px 0 4px; background:var(--surface); border:1px solid var(--accent-line); border-radius:11px; padding:12px; box-shadow:var(--shadow)}
.editor textarea{
  width:100%; min-height:88px; resize:vertical; border:1px solid var(--border); border-radius:8px;
  background:var(--bg); color:var(--text); font-family:Inter,sans-serif; font-size:14px; line-height:1.6; padding:10px 12px;
}
.editor textarea:focus{outline:2px solid var(--accent); outline-offset:-1px; border-color:transparent}
.editor .row{display:flex; align-items:center; gap:8px; margin-top:10px}
.editor .hint{font-size:11px; color:var(--text-faint); margin-left:auto}

.comments{display:flex; flex-direction:column; gap:8px; margin:12px 0 4px}
.comment{background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--accent); border-radius:0 10px 10px 0; padding:11px 14px}
.comment .ctop{display:flex; align-items:center; gap:8px; margin-bottom:5px}
.comment .who{font-family:Orbitron,sans-serif; font-weight:700; font-size:9px; letter-spacing:.12em; color:var(--accent-text)}
.comment .when{font-size:10.5px; color:var(--text-faint); font-variant-numeric:tabular-nums}
.comment .acts{margin-left:auto; display:flex; gap:2px}
.comment .acts button{
  background:none; border:none; color:var(--text-faint); font-size:11px; font-weight:600;
  cursor:pointer; padding:2px 6px; border-radius:5px; font-family:Inter,sans-serif;
}
.comment .acts button:hover{color:var(--text); background:var(--surface-2)}
.comment .acts button.del:hover{color:var(--alert)}
.comment .body{font-size:14px; line-height:1.6; white-space:pre-wrap; color:var(--text)}

/* ---------- drawer ---------- */
.scrim{position:fixed; inset:0; background:rgba(15,23,42,.45); z-index:50; opacity:0; pointer-events:none; transition:opacity .2s ease}
.scrim.open{opacity:1; pointer-events:auto}
.drawer{
  position:fixed; top:0; right:0; height:100%; width:min(420px,92vw); z-index:60; background:var(--bg);
  border-left:1px solid var(--border); transform:translateX(100%); transition:transform .24s cubic-bezier(.4,0,.2,1);
  display:flex; flex-direction:column;
}
.drawer.open{transform:translateX(0)}
.drawer header{display:flex; align-items:center; gap:12px; padding:18px 20px; border-bottom:1px solid var(--border)}
.drawer header h3{margin:0; font-family:Orbitron,sans-serif; font-size:11px; letter-spacing:.14em; text-transform:uppercase}
.drawer .body{overflow-y:auto; padding:14px 20px 40px; display:flex; flex-direction:column; gap:10px}
.drawer .grp{font-family:Orbitron,sans-serif; font-weight:700; font-size:9px; letter-spacing:.12em; text-transform:uppercase; color:var(--text-faint); margin:14px 0 2px}
.tabs{display:flex; gap:4px; background:var(--surface-2); padding:3px; border-radius:9px}
.tab{
  font-family:Orbitron,sans-serif; font-weight:700; font-size:9px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--text-dim); background:transparent; border:1px solid transparent;
  border-radius:7px; padding:6px 11px; cursor:pointer;
}
.tab.is-on{background:var(--surface); color:var(--text); border-color:var(--accent-line)}
.tab:focus-visible{outline:2px solid var(--accent); outline-offset:1px}
.qrow{display:flex; gap:10px; align-items:flex-start}
.qrow .tick{
  font-family:Orbitron,sans-serif; font-weight:700; font-size:9px; letter-spacing:.06em;
  border-radius:5px; padding:3px 6px; flex:none; margin-top:1px;
}
.qrow .tick.todo{color:#fff; background:var(--accent)}
.qrow .tick.done{color:var(--ok); border:1px solid var(--ok)}
.qrow .qt{min-width:0}
.qrow .qtag{font-size:12px; font-weight:600; color:var(--text); display:block; margin-bottom:3px}
.dcard.answered{opacity:.6}
button.progress{
  background:transparent; border:1px solid transparent; border-radius:9px; padding:5px 9px;
  cursor:pointer; font-family:inherit;
}
button.progress:hover{background:var(--surface-2); border-color:var(--border)}
button.progress:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.dcard{background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:11px 13px; cursor:pointer; text-align:left; width:100%; font:inherit; color:inherit}
.dcard:hover{border-color:var(--accent-line)}
.dcard .q{font-size:11px; color:var(--text-faint); margin-bottom:5px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.dcard .t{font-size:13.5px; line-height:1.55; white-space:pre-wrap}
.empty{color:var(--text-faint); font-size:13.5px; text-align:center; padding:40px 20px; line-height:1.6}

/* ---------- export modal ---------- */
.modal{position:fixed; inset:0; z-index:70; display:none; place-items:center; padding:24px}
.modal.open{display:grid}
.modal .card{background:var(--bg); border:1px solid var(--border); border-radius:14px; width:min(760px,100%); max-height:86vh; display:flex; flex-direction:column; box-shadow:var(--shadow)}
.modal header{display:flex; align-items:center; gap:12px; padding:18px 20px; border-bottom:1px solid var(--border)}
.modal header h3{margin:0; font-family:Orbitron,sans-serif; font-size:11px; letter-spacing:.14em; text-transform:uppercase}
.modal .out{
  flex:1; overflow:auto; margin:0; padding:16px 20px; background:var(--code-bg); color:var(--code-text);
  font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12px; line-height:1.6; white-space:pre-wrap; border:none;
}
.modal footer{display:flex; align-items:center; gap:10px; padding:14px 20px; border-top:1px solid var(--border)}
.modal footer .note{font-size:11.5px; color:var(--text-dim); margin-right:auto; line-height:1.5}

.warn{
  max-width:1280px; margin:0 auto; padding:10px 24px; font-size:12.5px; color:var(--alert);
  background:var(--accent-soft); border-bottom:1px solid var(--border); display:none;
}
.warn.show{display:block}
.warn.info{color:var(--text-dim); background:var(--surface-2)}
.warn.info strong{color:var(--text)}

@media (max-width:1080px){
  .shell{grid-template-columns:1fr; gap:0}
  .toc{display:none}
  main{padding:28px 0 140px}
  .block > .addbtn{position:static; opacity:1; margin-top:8px}
}
@media (max-width:620px){
  .topbar-inner{gap:10px; padding:0 16px}
  .wordmark .sub, .progress .bar{display:none}
  .shell{padding:0 16px}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="wordmark">
      <span class="dot"></span>
      <span class="name" id="wmName">Review</span>
      <span class="sub" id="wmSub"></span>
    </div>
    <div class="spacer"></div>
    <button class="progress" id="openQuestions" title="Jump to an open question">
      <span class="bar"><i id="pbar"></i></span>
      <span><b id="pnum">0/0</b> questions answered</span>
    </button>
    <span class="save-state" id="saveState" hidden></span>
    <button class="btn" id="openDrawer">Comments <span class="count" id="ccount">0</span></button>
    <button class="btn btn-primary" id="exportBtn">Export</button>
    <button class="btn btn-ghost" id="themeBtn" aria-label="Toggle colour theme" title="Toggle colour theme">◐</button>
  </div>
</header>

<div class="warn" id="storageWarn">
  This browser is not letting the page save to local storage, so your comments will be lost when you close the tab.
  Use <strong>Export</strong> before you leave.
</div>
<div class="warn info" id="staleWarn"></div>

<div class="shell">
  <nav class="toc" id="toc" aria-label="Sections"><h4 class="label">Contents</h4></nav>
  <main><article id="doc"></article></main>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="All comments">
  <header>
    <div class="tabs">
      <button class="tab is-on" id="tabQuestions" data-tab="questions">Questions</button>
      <button class="tab" id="tabComments" data-tab="comments">Comments</button>
    </div>
    <div class="spacer"></div>
    <button class="btn btn-ghost" id="closeDrawer" aria-label="Close">✕</button>
  </header>
  <div class="body" id="drawerBody"></div>
</aside>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Export comments">
  <div class="card">
    <header>
      <h3>Export</h3>
      <div class="spacer"></div>
      <button class="btn btn-ghost" id="closeModal" aria-label="Close">✕</button>
    </header>
    <pre class="out" id="exportOut"></pre>
    <footer>
      <span class="note">Save this into the repo beside the source documents, then tell Claude to read it.</span>
      <button class="btn" id="copyBtn">Copy</button>
      <button class="btn btn-primary" id="downloadBtn">Download .md</button>
    </footer>
  </div>
</div>

<script id="review-config" type="application/json">
{
  "title": "Untitled Review",
  "subtitle": "· review draft",
  "storageKey": "sk-review-untitled-v1",
  "exportFileName": "review-comments.md",
  "sources": []
}
</script>

<script id="spec-src" type="text/plain">
# Untitled Review

Run scripts/review-sync.js to fill this in.
</script>

<script>
(function(){
"use strict";

/* ---------------- config ---------------- */
var CONFIG = { title: "Review", subtitle: "", storageKey: "sk-review-v1",
               exportFileName: "review-comments.md", sources: [], persist: "local", comments: null };
try {
  CONFIG = Object.assign(CONFIG, JSON.parse(document.getElementById("review-config").textContent));
} catch (e) { /* keep defaults */ }

document.title = CONFIG.title;
document.getElementById("wmName").textContent = CONFIG.title;
document.getElementById("wmSub").textContent = CONFIG.subtitle || "";

/* ---------------- storage ----------------
   Two backends behind one `save()`. Every mutation in this file writes `data[id]` and then calls
   save(), so this is the only place that knows which is in play.

     'local'  (default)  localStorage, for a page opened straight off the filesystem.
     'server'            POST to the review server, which writes a JSON file into the repo.

   Server mode is the better round-trip when a review runs over several rounds — the comments land
   in the repo instead of in one browser profile, and there is no export step. It is chosen by
   review-serve.js, never by review-sync.js, so a static page's behaviour is unchanged. */
var KEY = CONFIG.storageKey;
var SERVER = CONFIG.persist === "server";
var storageOK = true;
var data = {};

if (SERVER) {
  data = CONFIG.comments && typeof CONFIG.comments === "object" ? CONFIG.comments : {};
  var saveEl = document.getElementById("saveState");
  if (saveEl) { saveEl.hidden = false; saveEl.className = "save-state saved"; saveEl.textContent = "Saved to repo"; }
  /* Export is not part of the round-trip here — the comments are already in the repo, and the
     agent reads them from disk. Leave it available for taking a readable copy away, but demote it
     so it no longer looks like the button that submits the review. */
  var exp = document.getElementById("exportBtn");
  if (exp) {
    exp.className = "btn";
    exp.textContent = "Download a copy";
    exp.title = "Optional. Your comments are already saved in the repo — this just takes a readable markdown copy.";
  }
} else {
  try {
    var raw = window.localStorage.getItem(KEY);
    data = raw ? JSON.parse(raw) : {};
  } catch (e) { storageOK = false; data = {}; }
  if (!storageOK) document.getElementById("storageWarn").classList.add("show");
}

/* Server saves are coalesced: typing a comment fires save() on every keystroke in some paths, and
   one POST per keystroke would race — a slow response could land after a newer one and write back
   stale text. A short debounce plus "only one request in flight" keeps the file consistent. */
var saveTimer = null, saveInFlight = false, savePending = false;

function postSave(){
  if (saveInFlight) { savePending = true; return; }
  saveInFlight = true;
  var body = JSON.stringify(data);
  fetch("/save", { method: "POST", headers: { "Content-Type": "application/json" }, body: body })
    .then(function(r){ return r.json(); })
    .then(function(res){
      saveInFlight = false;
      setSaveState(res && res.ok ? "saved" : "error");
      if (savePending) { savePending = false; postSave(); }
    })
    .catch(function(){
      saveInFlight = false;
      setSaveState("error");
      if (savePending) { savePending = false; postSave(); }
    });
}

function setSaveState(state){
  var el = document.getElementById("saveState");
  if (!el) return;
  el.className = "save-state " + state;
  el.textContent = state === "saved" ? "Saved to repo"
                 : state === "saving" ? "Saving…"
                 : "Not saved — is the server still running?";
}

function save(){
  if (SERVER) {
    setSaveState("saving");
    if (saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(postSave, 400);
    return;
  }
  if (!storageOK) return;
  try { window.localStorage.setItem(KEY, JSON.stringify(data)); }
  catch (e) { storageOK = false; document.getElementById("storageWarn").classList.add("show"); }
}

/* ---------------- theme ---------------- */
var TKEY = CONFIG.storageKey + "-theme";
try { var t = localStorage.getItem(TKEY); if (t) document.documentElement.setAttribute("data-theme", t); } catch (e) {}
document.getElementById("themeBtn").addEventListener("click", function(){
  var cur = document.documentElement.getAttribute("data-theme");
  var isDark = cur ? cur === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
  var next = isDark ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try { localStorage.setItem(TKEY, next); } catch (e) {}
});

/* ---------------- markdown ---------------- */
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function inline(s){
  var codes = [];
  s = esc(s).replace(/`([^`]+)`/g, function(_, c){ codes.push(c); return "@@CODE" + (codes.length-1) + "@@"; });
  s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a class="mdlink" href="$2">$1</a>');
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/(^|[\s(])\*([^*\n]+)\*/g, "$1<em>$2</em>");
  s = s.replace(/@@CODE([0-9]+)@@/g, function(_, i){ return "<code>" + codes[+i] + "</code>"; });
  return s;
}

function hash(str){
  var h = 5381;
  for (var i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) >>> 0;
  return h.toString(36);
}

function parse(md){
  var lines = md.replace(/\r/g, "").split("\n");
  var blocks = [], i = 0;

  function isListStart(l){ return /^\s*[-*] /.test(l); }
  function isOrderedStart(l){ return /^\s*\d+\. /.test(l); }
  function isBlockStart(l){
    return l.trim() === "" || /^#{1,6} /.test(l) || /^```/.test(l) || /^>/.test(l) ||
           /^\|/.test(l) || isListStart(l) || isOrderedStart(l) || /^---\s*$/.test(l);
  }

  while (i < lines.length){
    var line = lines[i];

    if (line.trim() === ""){ i++; continue; }

    if (/^```/.test(line)){
      var code = []; i++;
      while (i < lines.length && !/^```/.test(lines[i])) code.push(lines[i++]);
      i++;
      blocks.push({ type: "code", text: code.join("\n") });
      continue;
    }

    var hm = line.match(/^(#{1,6}) (.*)$/);
    if (hm){ blocks.push({ type: "h", level: hm[1].length, text: hm[2].trim() }); i++; continue; }

    if (/^---\s*$/.test(line)){ i++; continue; }

    if (/^>/.test(line)){
      var q = [];
      while (i < lines.length && /^>/.test(lines[i])) q.push(lines[i++].replace(/^>\s?/, ""));
      blocks.push({ type: "quote", text: q.join(" ").trim() });
      continue;
    }

    if (/^\|/.test(line)){
      var rows = [];
      while (i < lines.length && /^\|/.test(lines[i])) rows.push(lines[i++]);
      blocks.push({ type: "table", rows: rows });
      continue;
    }

    if (isListStart(line) || isOrderedStart(line)){
      var ordered = isOrderedStart(line);
      var items = [];
      while (i < lines.length){
        var l = lines[i];
        if (ordered ? isOrderedStart(l) : isListStart(l)){
          items.push(l.replace(/^\s*(?:[-*]|\d+\.) /, ""));
          i++;
        } else if (l.trim() !== "" && /^\s+\S/.test(l) && items.length){
          items[items.length - 1] += " " + l.trim();
          i++;
        } else break;
      }
      blocks.push({ type: ordered ? "ol" : "ul", items: items });
      continue;
    }

    var para = [];
    while (i < lines.length && !isBlockStart(lines[i])) para.push(lines[i++]);
    blocks.push({ type: "p", text: para.join(" ").trim() });
  }
  return blocks;
}

/* ---------------- render ---------------- */
var doc = document.getElementById("doc");
var tocEl = document.getElementById("toc");
var blocks = parse(document.getElementById("spec-src").textContent);
var sections = [];      // {id, title, num, el}
var questionIds = [];   // block ids that are open questions
var blockMeta = {};     // id -> {section, quote, qnum}
var seenIds = {};
var currentSection = null;
var qCounter = 0;
var dCounter = 0;
var seenTitle = false;

function uid(text){
  var base = "b" + hash(text.slice(0, 160));
  var n = 0, id = base;
  while (seenIds[id]) { n++; id = base + "-" + n; }
  seenIds[id] = true;
  return id;
}

function plain(html){
  var d = document.createElement("div");
  d.innerHTML = html;
  return (d.textContent || "").replace(/\s+/g, " ").trim();
}

function wrap(inner, sourceText, opts){
  opts = opts || {};
  var id = uid(sourceText);
  var div = document.createElement("div");
  div.className = "block" + (opts.cls ? " " + opts.cls : "");
  div.id = id;
  div.innerHTML = inner;
  var btn = document.createElement("button");
  btn.className = "addbtn";
  btn.type = "button";
  btn.setAttribute("aria-label", "Add a comment here");
  btn.innerHTML = "&#43;";
  btn.addEventListener("click", function(){ openEditor(id, div); });
  div.appendChild(btn);
  blockMeta[id] = {
    section: currentSection ? currentSection.title : "Preamble",
    quote: plain(inner).slice(0, 150),
    qnum: opts.qnum || null,
    qtag: opts.qtag || null
  };
  if (opts.qnum) questionIds.push(id);
  doc.appendChild(div);
  return div;
}

// Title and meta, both derived rather than hardcoded: the heading is the first document's own h1,
// and the chips name the source files so a reader knows what they are commenting on.
var firstH1 = blocks.filter(function(b){ return b.type === "h" && b.level === 1; })[0];
var titleWrap = document.createElement("div");
titleWrap.innerHTML =
  '<h1 class="doc-title">' + inline(firstH1 ? firstH1.text : CONFIG.title) + "</h1>" +
  '<div class="doc-meta">' +
    (CONFIG.sources || []).map(function(s){
      return '<span class="chip"><strong>' + esc(s) + "</strong></span>";
    }).join("") +
    '<span class="chip">Click the <strong>+</strong> beside any block to comment</span>' +
  "</div>";
doc.appendChild(titleWrap);

blocks.forEach(function(b){
  // The page concatenates more than one document. The first h1 is the page title, already
  // rendered above; any later one starts a new document and reads as a major break.
  if (b.type === "h" && b.level === 1 && !seenTitle){ seenTitle = true; return; }

  if (b.type === "h"){
    if (b.level === 2 || b.level === 1){
      var sid = "s" + hash(b.text);
      var h2 = document.createElement("h2");
      if (b.level === 1) h2.className = "docbreak";
      h2.id = sid;
      h2.innerHTML = inline(b.text);
      doc.appendChild(h2);
      currentSection = { id: sid, title: b.text, count: 0, isDoc: b.level === 1, subs: [] };
      sections.push(currentSection);
    } else {
      var h3 = document.createElement("h3");
      h3.id = "h" + hash(b.text);
      h3.innerHTML = inline(b.text);
      doc.appendChild(h3);
      if (currentSection) currentSection.subs.push({ id: h3.id, title: b.text });
    }
    return;
  }

  if (b.type === "p"){
    // The first document's metadata lines are already drawn as chips under the title. A later
    // document's own header lines are not, so only strip these before any section has begun.
    if (!currentSection && /^\*\*(Status|Supersedes|Related|Review):/.test(b.text)) return;
    wrap("<p>" + inline(b.text) + "</p>", b.text);
    return;
  }

  if (b.type === "code"){
    wrap("<pre><code>" + esc(b.text) + "</code></pre>", b.text);
    return;
  }

  if (b.type === "ul" || b.type === "ol"){
    var tag = b.type === "ul" ? "ul" : "ol";
    var html = "<" + tag + ">" + b.items.map(function(it){ return "<li>" + inline(it) + "</li>"; }).join("") + "</" + tag + ">";
    wrap(html, b.items.join("|"));
    return;
  }

  if (b.type === "table"){
    var cells = b.rows.map(function(r){
      return r.replace(/^\||\|$/g, "").split("|").map(function(c){ return c.trim(); });
    });
    var head = cells[0], body = cells.slice(2);
    var html = '<div class="tablewrap"><table><thead><tr>' +
      head.map(function(c){ return "<th>" + inline(c) + "</th>"; }).join("") +
      "</tr></thead><tbody>" +
      body.map(function(r){
        return "<tr>" + r.map(function(c){ return "<td>" + inline(c) + "</td>"; }).join("") + "</tr>";
      }).join("") +
      "</tbody></table></div>";
    wrap(html, b.rows.join("\n"));
    return;
  }

  if (b.type === "quote"){
    var m = b.text.match(/^\*\*Open\s*[—-]\s*([^*]+?)\.?\*\*\s*([\s\S]*)$/);
    if (m){
      qCounter++;
      var html2 =
        '<div class="qhead">' +
          '<span class="qnum">Q' + qCounter + '</span>' +
          '<span class="qtag">Open &middot; ' + inline(m[1].trim()) + "</span>" +
        "</div><p>" + inline(m[2].trim()) + "</p>";
      wrap(html2, b.text, { cls: "qblock", qnum: qCounter, qtag: m[1].trim() });
      return;
    }
    var d = b.text.match(/^\*\*Decided\s*[—-]\s*([^*]+?)\.?\*\*\s*([\s\S]*)$/);
    if (d){
      dCounter++;
      var html3 =
        '<div class="qhead">' +
          '<span class="qnum">&#10003; D' + dCounter + '</span>' +
          '<span class="qtag">Decided &middot; ' + inline(d[1].trim()) + "</span>" +
        "</div><p>" + inline(d[2].trim()) + "</p>";
      wrap(html3, b.text, { cls: "dblock" });
      return;
    }
    wrap('<blockquote class="note">' + inline(b.text) + "</blockquote>", b.text);
    return;
  }
});

/* ---------------- table of contents ---------------- */
// Rows carry the document's OWN section number where the heading has one, so a reference to
// "§2.3" in the prose matches what the sidebar shows. Sequential numbering would fight it —
// two concatenated documents both have a section 2.
function splitNumber(title){
  var m = title.match(/^(\d+(?:\.\d+)*)\.?\s+(.*)$/);
  return m ? { num: m[1], text: m[2] } : { num: null, text: title };
}

sections.forEach(function(s){
  var group = document.createElement("div");
  group.className = "tocgroup";

  var head = splitNumber(s.title);
  var a = document.createElement("a");
  a.href = "#" + s.id;
  a.dataset.section = s.title;
  if (s.isDoc) a.className = "docrow";
  a.innerHTML = '<span class="num">' + (s.isDoc ? "&#9679;" : esc(head.num || "&middot;")) + "</span>" +
                "<span>" + esc(head.text) + "</span>" +
                '<span class="badge" hidden></span>';
  group.appendChild(a);

  // Subsections stay collapsed until you are reading that section, so the sidebar stays short
  // but "2.3" is reachable the moment it is relevant.
  s.subs.forEach(function(sub){
    var subInfo = splitNumber(sub.title);
    var sa = document.createElement("a");
    sa.className = "sub";
    sa.href = "#" + sub.id;
    sa.innerHTML = '<span class="num">' + esc(subInfo.num || "&middot;") + "</span>" +
                   "<span>" + esc(subInfo.text) + "</span>";
    group.appendChild(sa);
  });

  tocEl.appendChild(group);
  s.link = a;
  s.group = group;
});

/* ---------------- comment UI ---------------- */
function fmtTime(ts){
  var d = new Date(ts);
  return d.toLocaleDateString(undefined, { day: "numeric", month: "short" }) + " " +
         d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
}

function listFor(id){ return data[id] || []; }

function renderComments(id, blockEl){
  var existing = blockEl.querySelector(".comments");
  if (existing) existing.remove();
  var items = listFor(id);
  blockEl.classList.toggle("has-comments", items.length > 0);
  if (!items.length) return;

  var box = document.createElement("div");
  box.className = "comments";
  items.forEach(function(c){
    var el = document.createElement("div");
    el.className = "comment";
    var top = document.createElement("div");
    top.className = "ctop";
    top.innerHTML = '<span class="who">Note</span><span class="when">' + fmtTime(c.ts) + "</span>";
    var acts = document.createElement("div");
    acts.className = "acts";
    var ed = document.createElement("button");
    ed.type = "button"; ed.textContent = "Edit";
    ed.addEventListener("click", function(){ openEditor(id, blockEl, c); });
    var del = document.createElement("button");
    del.type = "button"; del.className = "del"; del.textContent = "Delete";
    del.addEventListener("click", function(){
      data[id] = listFor(id).filter(function(x){ return x.id !== c.id; });
      if (!data[id].length) delete data[id];
      save(); renderComments(id, blockEl); refresh();
    });
    acts.appendChild(ed); acts.appendChild(del);
    top.appendChild(acts);
    var body = document.createElement("div");
    body.className = "body";
    body.textContent = c.text;
    el.appendChild(top); el.appendChild(body);
    box.appendChild(el);
  });
  blockEl.insertBefore(box, blockEl.querySelector(".addbtn"));
}

function openEditor(id, blockEl, editing){
  var old = blockEl.querySelector(".editor");
  if (old) old.remove();

  var ed = document.createElement("div");
  ed.className = "editor";
  var ta = document.createElement("textarea");
  ta.placeholder = "What do you think? Disagree, decide, or ask for something different…";
  ta.value = editing ? editing.text : "";
  var row = document.createElement("div");
  row.className = "row";
  var saveBtn = document.createElement("button");
  saveBtn.className = "btn btn-primary"; saveBtn.type = "button";
  saveBtn.textContent = editing ? "Update" : "Add comment";
  var cancel = document.createElement("button");
  cancel.className = "btn"; cancel.type = "button"; cancel.textContent = "Cancel";
  var hint = document.createElement("span");
  hint.className = "hint"; hint.textContent = "Ctrl+Enter to save";
  row.appendChild(saveBtn); row.appendChild(cancel); row.appendChild(hint);
  ed.appendChild(ta); ed.appendChild(row);
  blockEl.insertBefore(ed, blockEl.querySelector(".addbtn"));
  ta.focus();

  function commit(){
    var text = ta.value.trim();
    if (!text){ ed.remove(); return; }
    if (editing){
      editing.text = text;
      editing.ts = Date.now();
    } else {
      if (!data[id]) data[id] = [];
      data[id].push({ id: "c" + Date.now() + Math.floor(Math.random() * 1000), text: text, ts: Date.now() });
    }
    save(); ed.remove(); renderComments(id, blockEl); refresh();
  }
  saveBtn.addEventListener("click", commit);
  cancel.addEventListener("click", function(){ ed.remove(); });
  ta.addEventListener("keydown", function(e){
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); commit(); }
    if (e.key === "Escape") { e.preventDefault(); ed.remove(); }
  });
}

/* ---------------- counters, drawer ---------------- */
var drawer = document.getElementById("drawer");
var scrim = document.getElementById("scrim");
var drawerBody = document.getElementById("drawerBody");
var activeTab = "questions";

function totalComments(){
  return Object.keys(data).reduce(function(n, k){ return n + data[k].length; }, 0);
}

function refresh(){
  var total = totalComments();
  document.getElementById("ccount").textContent = total;

  var answered = questionIds.filter(function(id){ return listFor(id).length > 0; }).length;
  document.getElementById("pnum").textContent = answered + "/" + questionIds.length;
  document.getElementById("pbar").style.width =
    (questionIds.length ? (answered / questionIds.length) * 100 : 0) + "%";

  sections.forEach(function(s){
    var n = 0;
    Object.keys(data).forEach(function(id){
      if (blockMeta[id] && blockMeta[id].section === s.title) n += data[id].length;
    });
    var badge = s.link.querySelector(".badge");
    badge.textContent = n;
    badge.hidden = n === 0;
  });

  document.getElementById("tabQuestions").textContent =
    "Questions " + (questionIds.length - answered);
  document.getElementById("tabComments").textContent = "Comments " + total;

  drawerBody.innerHTML = "";
  if (activeTab === "questions") renderQuestionsTab();
  else renderCommentsTab(total);
}

function jumpTo(id){
  closeDrawer();
  var el = document.getElementById(id);
  if (!el) return;
  el.scrollIntoView({ block: "center" });
  el.classList.remove("flash");
  void el.offsetWidth;
  el.classList.add("flash");
}

function renderQuestionsTab(){
  if (!questionIds.length){
    drawerBody.innerHTML = '<div class="empty">No open questions in this document.</div>';
    return;
  }
  var lastSection = null;
  questionIds.forEach(function(id){
    var meta = blockMeta[id];
    var answered = listFor(id).length > 0;

    if (meta.section !== lastSection){
      lastSection = meta.section;
      var g = document.createElement("div");
      g.className = "grp";
      g.textContent = meta.section;
      drawerBody.appendChild(g);
    }

    var card = document.createElement("button");
    card.type = "button";
    card.className = "dcard" + (answered ? " answered" : "");
    var row = document.createElement("div");
    row.className = "qrow";
    row.innerHTML =
      '<span class="tick ' + (answered ? "done" : "todo") + '">' +
        (answered ? "&#10003;" : "Q" + meta.qnum) + "</span>" +
      '<span class="qt">' +
        '<span class="qtag">' + esc(meta.qtag || ("Question " + meta.qnum)) + "</span>" +
        '<span class="q">' + esc(meta.quote.slice(0, 130)) + "&hellip;</span>" +
      "</span>";
    card.appendChild(row);
    card.addEventListener("click", function(){ jumpTo(id); });
    drawerBody.appendChild(card);
  });
}

function renderCommentsTab(total){
  if (!total){
    drawerBody.innerHTML = '<div class="empty">No comments yet.<br>Hover any paragraph and press <strong>+</strong>.</div>';
    return;
  }
  var bySection = {};
  Object.keys(data).forEach(function(id){
    var sec = blockMeta[id] ? blockMeta[id].section : "Other";
    (bySection[sec] = bySection[sec] || []).push(id);
  });
  sections.concat([{ title: "Preamble" }]).forEach(function(s){
    var ids = bySection[s.title];
    if (!ids) return;
    var g = document.createElement("div");
    g.className = "grp";
    g.textContent = s.title;
    drawerBody.appendChild(g);
    ids.forEach(function(id){
      listFor(id).forEach(function(c){
        var card = document.createElement("button");
        card.type = "button";
        card.className = "dcard";
        var q = blockMeta[id].qnum ? "Q" + blockMeta[id].qnum + " · " : "";
        card.innerHTML = '<div class="q">' + esc(q + blockMeta[id].quote) + "</div>";
        var t = document.createElement("div");
        t.className = "t";
        t.textContent = c.text;
        card.appendChild(t);
        card.addEventListener("click", function(){ jumpTo(id); });
        drawerBody.appendChild(card);
      });
    });
  });
}

function openDrawer(tab){
  if (tab) setTab(tab);
  drawer.classList.add("open");
  scrim.classList.add("open");
}
function closeDrawer(){ drawer.classList.remove("open"); scrim.classList.remove("open"); }

function setTab(tab){
  activeTab = tab;
  document.getElementById("tabQuestions").classList.toggle("is-on", tab === "questions");
  document.getElementById("tabComments").classList.toggle("is-on", tab === "comments");
  refresh();
}
document.getElementById("tabQuestions").addEventListener("click", function(){ setTab("questions"); });
document.getElementById("tabComments").addEventListener("click", function(){ setTab("comments"); });
document.getElementById("openQuestions").addEventListener("click", function(){ openDrawer("questions"); });

document.getElementById("openDrawer").addEventListener("click", function(){ openDrawer("comments"); });
document.getElementById("closeDrawer").addEventListener("click", closeDrawer);
scrim.addEventListener("click", closeDrawer);

/* ---------------- export ---------------- */
function buildMarkdown(){
  var out = [];
  out.push("# " + CONFIG.title + " — Review Comments");
  out.push("");
  out.push("Exported " + new Date().toLocaleString() + " · " + totalComments() + " comment(s) on " + (CONFIG.sources || []).map(function(x){ return "`" + x + "`"; }).join(", ") + ".");
  out.push("");
  var any = false;
  sections.concat([{ title: "Preamble" }]).forEach(function(s){
    var ids = Object.keys(data).filter(function(id){
      return blockMeta[id] && blockMeta[id].section === s.title;
    });
    if (!ids.length) return;
    any = true;
    out.push("## " + s.title);
    out.push("");
    ids.forEach(function(id){
      var meta = blockMeta[id];
      var label = meta.qnum ? "Open question Q" + meta.qnum : "On";
      out.push("**" + label + "** — “" + meta.quote + "…”");
      out.push("");
      listFor(id).forEach(function(c){
        out.push("- " + c.text.split("\n").join("\n  "));
      });
      out.push("");
    });
  });
  if (!any) out.push("_No comments._");
  return out.join("\n");
}

var modal = document.getElementById("modal");
document.getElementById("exportBtn").addEventListener("click", function(){
  document.getElementById("exportOut").textContent = buildMarkdown();
  modal.classList.add("open");
});
document.getElementById("closeModal").addEventListener("click", function(){ modal.classList.remove("open"); });
modal.addEventListener("click", function(e){ if (e.target === modal) modal.classList.remove("open"); });
document.addEventListener("keydown", function(e){
  if (e.key === "Escape"){ modal.classList.remove("open"); closeDrawer(); }
});

document.getElementById("copyBtn").addEventListener("click", function(){
  var btn = this, text = buildMarkdown();
  function done(){ btn.textContent = "Copied"; setTimeout(function(){ btn.textContent = "Copy"; }, 1600); }
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done, fallback);
  } else fallback();
  function fallback(){
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); done(); }
    catch (e) { btn.textContent = "Select above"; }
    document.body.removeChild(ta);
  }
});

document.getElementById("downloadBtn").addEventListener("click", function(){
  var blob = new Blob([buildMarkdown()], { type: "text/markdown;charset=utf-8" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = CONFIG.exportFileName;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
});

/* ---------------- restore + scrollspy ---------------- */
// A comment is keyed to the text it was attached to. When that text is revised — which is what
// happens once a round of review is applied to the spec — the key no longer resolves. Those
// comments have served their purpose, so retire them rather than leaving them counted but unseen.
var stale = 0;
Object.keys(data).forEach(function(id){
  var el = document.getElementById(id);
  if (el) { renderComments(id, el); return; }
  stale += data[id].length;
  delete data[id];
});
if (stale){
  save();
  var sw = document.getElementById("staleWarn");
  sw.innerHTML = "<strong>" + stale + " earlier comment" + (stale === 1 ? "" : "s") +
    "</strong> were written against wording that has since been revised, so they have been " +
    "cleared. They were already applied to the spec &mdash; this page is ready for the next round.";
  sw.classList.add("show");
}
refresh();

var headings = sections.map(function(s){ return document.getElementById(s.id); }).filter(Boolean);
function spy(){
  var best = null;
  headings.forEach(function(h){
    if (h.getBoundingClientRect().top <= 140) best = h;
  });
  sections.forEach(function(s){
    var isActive = !!(best && s.id === best.id);
    s.link.classList.toggle("active", isActive);
    if (s.group) s.group.classList.toggle("open", isActive);
  });
}
window.addEventListener("scroll", spy, { passive: true });
spy();

})();
</script>
